# zmk-achroma-module/dts/bindings/zmk,physical-layout.yaml
description: Custom out-of-tree hardware matrix layout mapping binding schema

compatible: "zmk,physical-layout"

include: base.yaml

properties:
  display-name:
    type: string
    required: true
    description: Human readable name displayed on configuration layouts
  transform:
    type: phandle
    required: true
    description: Handle pointer mapping to the target keymap matrix transform node
  kscan:
    type: phandle
    required: false
    description: Handle pointer mapping to the physical hardware GPIO matrix scanner node
